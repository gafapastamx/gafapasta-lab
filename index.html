<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GAFAPASTA // Lab de Arquitectura Facial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #050505; color: #f5f5f5; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .espejo { transform: scaleX(-1); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- Contenedor de Video y Canvas -->
  <div class="relative w-full h-full max-w-md mx-auto bg-black overflow-hidden">
    <video id="webcam" autoplay playsinline muted class="hidden"></video>
    <canvas id="output_canvas" class="w-full h-full object-cover espejo"></canvas>

    <!-- Pantalla de Carga -->
    <div id="loader" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-6 text-center z-30">
      <p class="text-lime-400 text-xs tracking-widest uppercase mb-2">// GAFAPASTA LAB v1.0</p>
      <h1 class="text-xl font-bold uppercase tracking-tight mb-4">Escáner de Arquitectura Facial</h1>
      <p id="status-text" class="text-xs text-neutral-400 mb-6">Cargando motor biométrico 3D...</p>
      <button id="start-btn" class="hidden bg-lime-400 text-black font-bold px-6 py-3 text-xs uppercase tracking-widest hover:bg-white transition">
        Encender Cámara →
      </button>
    </div>

    <!-- HUD Superior: Diagnóstico Biométrico -->
    <div id="hud" class="hidden absolute top-4 left-4 right-4 bg-black/80 backdrop-blur-md border border-white/20 p-3 text-xs z-20">
      <div class="flex justify-between items-center border-b border-white/15 pb-1 mb-2">
        <span class="text-lime-400 font-bold tracking-widest uppercase">// LECTURA EN VIVO</span>
        <span id="hud-ratio" class="bg-white/10 px-1.5 py-0.5 text-[10px]">ÍNDICE: --</span>
      </div>
      <p id="hud-arquetipo" class="text-neutral-200 leading-relaxed">Analizando tercios faciales...</p>
    </div>

    <!-- Controles Inferiores -->
    <div id="controls" class="hidden absolute bottom-5 left-4 right-4 bg-black/90 backdrop-blur-md border border-white/30 p-4 z-20">
      <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] text-neutral-400 uppercase tracking-wider">Selecciona Silueta (Escala Real mm)</span>
        <span id="frame-calibre" class="text-[10px] text-lime-400 font-bold">140mm</span>
      </div>

      <!-- Botones de Armazones -->
      <div id="frame-list" class="flex gap-2 mb-3 overflow-x-auto pb-1"></div>

      <!-- Botón de WhatsApp -->
      <a id="wa-link" href="#" target="_blank" class="block w-full text-center bg-lime-400 text-black font-bold py-2.5 text-xs uppercase tracking-widest hover:bg-white transition">
        Mandar mi diagnóstico por WhatsApp →
      </a>
    </div>
  </div>

  <!-- Lógica MediaPipe + Renderizado Vectorial -->
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // Catálogo de prueba con SVGs integrados (No requiere subir fotos externas aún)
    const CATALOGO = [
      {
        id: "tokio-heavy",
        nombre: "Acetato Tokio 8mm",
        anchoMm: 138,
        calibre: "50-22-145",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180">
          <path d="M15,40 L215,40 L225,70 L275,70 L285,40 L485,40 L470,155 C465,170 440,175 385,175 C325,175 300,155 288,100 L275,85 L225,85 L212,100 C200,155 175,175 115,175 C60,175 35,170 30,155 Z" fill="none" stroke="#111111" stroke-width="26" stroke-linejoin="round"/>
          <path d="M15,40 L215,40 L225,70 L275,70 L285,40 L485,40 L470,155 C465,170 440,175 385,175 C325,175 300,155 288,100 L275,85 L225,85 L212,100 C200,155 175,175 115,175 C60,175 35,170 30,155 Z" fill="rgba(163,230,53,0.12)" stroke="#e5e5e5" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="42" cy="58" r="5" fill="#d4d4d4"/><circle cx="58" cy="58" r="5" fill="#d4d4d4"/>
          <circle cx="442" cy="58" r="5" fill="#d4d4d4"/><circle cx="458" cy="58" r="5" fill="#d4d4d4"/>
        </svg>`
      },
      {
        id: "aviador-80s",
        nombre: "Archivo 80s Doble Puente",
        anchoMm: 144,
        calibre: "56-16-145",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190">
          <line x1="160" y1="32" x2="340" y2="32" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
          <line x1="210" y1="62" x2="290" y2="62" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
          <path d="M30,45 L205,45 C220,45 225,130 190,165 C150,185 60,180 40,140 Z" fill="rgba(234,179,8,0.18)" stroke="#eab308" stroke-width="9"/>
          <path d="M470,45 L295,45 C280,45 275,130 310,165 C350,185 440,180 460,140 Z" fill="rgba(234,179,8,0.18)" stroke="#eab308" stroke-width="9"/>
        </svg>`
      },
      {
        id: "geo-brutal",
        nombre: "Hexagonal Brutalista",
        anchoMm: 136,
        calibre: "48-21-140",
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 175">
          <polygon points="35,65 80,35 195,35 220,75 195,150 75,150" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="16" stroke-linejoin="bevel"/>
          <polygon points="465,65 420,35 305,35 280,75 305,150 425,150" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="16" stroke-linejoin="bevel"/>
          <line x1="218" y1="72" x2="282" y2="72" stroke="#f43f5e" stroke-width="14"/>
        </svg>`
      }
    ];

    let armazonActual = CATALOGO[0];
    const frameImage = new Image();
    let faceLandmarker;
    let ratioActual = "--";
    let arquetipoActual = "";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start-btn");
    const statusText = document.getElementById("status-text");
    const loader = document.getElementById("loader");
    const hud = document.getElementById("hud");
    const controls = document.getElementById("controls");

    function cargarSVG(item) {
      armazonActual = item;
      document.getElementById("frame-calibre").innerText = `CALIBRE ${item.calibre} (${item.anchoMm}mm)`;
      const blob = new Blob([item.svg], { type: "image/svg+xml;charset=utf-8" });
      frameImage.src = URL.createObjectURL(blob);
      renderizarBotones();
      actualizarLinkWA();
    }

    function renderizarBotones() {
      const container = document.getElementById("frame-list");
      container.innerHTML = "";
      CATALOGO.forEach(item => {
        const btn = document.createElement("button");
        const activo = item.id === armazonActual.id;
        btn.className = `px-3 py-2 text-xs border whitespace-nowrap transition ${
          activo ? "bg-white text-black border-white font-bold" : "border-white/30 text-white hover:border-white"
        }`;
        btn.innerText = item.nombre;
        btn.onclick = () => cargarSVG(item);
        container.appendChild(btn);
      });
    }

    function actualizarLinkWA() {
      const msg = `Qué onda Gafapasta, me escanee en el Lab Virtual.\n• Índice Facial: ${ratioActual}\n• Diagnóstico: ${arquetipoActual}\n• Me probé: ${armazonActual.nombre} (${armazonActual.calibre})`;
      document.getElementById("wa-link").href = `https://wa.me/?text=${encodeURIComponent(msg)}`;
    }

    async function init() {
      cargarSVG(CATALOGO[0]);
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      statusText.innerText = "Motor 3D listo. Permite el acceso a tu cámara.";
      startBtn.classList.remove("hidden");
    }

    startBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        loader.classList.add("hidden");
        hud.classList.remove("hidden");
        controls.classList.remove("hidden");
        loop();
      };
    };

    function loop() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const res = faceLandmarker.detectForVideo(video, performance.now());
      if (res.faceLandmarks && res.faceLandmarks.length > 0) {
        const pts = res.faceLandmarks[0];
        const p = (idx) => ({ x: pts[idx].x * canvas.width, y: pts[idx].y * canvas.height });

        const puente = p(168);
        const ojoIzq = p(33);
        const ojoDer = p(263);
        const sienIzq = p(234);
        const sienDer = p(454);
        const frente = p(10);
        const menton = p(152);

        const roll = Math.atan2(ojoDer.y - ojoIzq.y, ojoDer.x - ojoIzq.x);
        const anchoCaraPx = Math.hypot(sienDer.x - sienIzq.x, sienDer.y - sienIzq.y);
        const altoCaraPx = Math.hypot(menton.x - frente.x, menton.y - frente.y);

        // Proporción biométrica
        const ratio = (altoCaraPx / anchoCaraPx).toFixed(2);
        if (ratio !== ratioActual) {
          ratioActual = ratio;
          if (ratio > 1.36) {
            arquetipoActual = "Rostro Vertical // Pide puente bajo o doble puente y volumen horizontal.";
          } else if (ratio < 1.22) {
            arquetipoActual = "Rostro Compacto-Angular // Pide líneas geométricas marcadas y puente llave.";
          } else {
            arquetipoActual = "Proporción Balanceada // Aguanta acetato pesado (8mm) y siluetas de autor.";
          }
          document.getElementById("hud-ratio").innerText = `ÍNDICE: ${ratioActual}`;
          document.getElementById("hud-arquetipo").innerText = arquetipoActual;
          actualizarLinkWA();
        }

        // Escala milimétrica (asumiendo 138mm promedio bicigomático)
        const pxPorMm = anchoCaraPx / 138;
        const anchoLentePx = armazonActual.anchoMm * pxPorMm;
        const altoLentePx = anchoLentePx * (180 / 500);

        // Ajuste de giro lateral (Yaw)
        const dIzq = Math.hypot(puente.x - sienIzq.x, puente.y - sienIzq.y);
        const dDer = Math.hypot(sienDer.x - puente.x, sienDer.y - puente.y);
        const yawScale = Math.max(0.82, 1 - (Math.abs(dIzq - dDer) / anchoCaraPx) * 0.35);

        ctx.save();
        ctx.translate(puente.x, puente.y);
        ctx.rotate(roll);
        ctx.scale(yawScale, 1);
        ctx.drawImage(frameImage, -anchoLentePx / 2, -altoLentePx * 0.36, anchoLentePx, altoLentePx);
        ctx.restore();
      }
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
